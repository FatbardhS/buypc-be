services:
  postgres:
    image: postgres:16-alpine
    container_name: buypc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: buypc
      POSTGRES_PASSWORD: buypc
      POSTGRES_DB: buypc
    ports:
      - "5432:5432"
    volumes:
      - buypc-data:/var/lib/postgresql/data

volumes:
  buypc-data:
